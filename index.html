<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Hot Dog Prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: "Roboto Serif", -apple-system, "Segoe UI", sans-serif; background: #fafafa; color: #222; }
  #wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 2.25rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 12px; color: #666; font-size: 0.9rem; font-family: 'Roboto Flex'; font-weight: 4300}
  svg { width: 100%; height: auto; display: block; background: #9dd9ff; border: 0px solid #e3e3e3; border-radius: 8px; -webkit-tap-highlight-color: transparent; }
  .state { fill: #ffffff; stroke: #9dd9ff; stroke-width: 0.75; }
  .state.canada { fill: #f6f6f6; }

  /* Each stadium is a group: an invisible circle catches hover/taps, the emoji sits on top */
  .stadium { cursor: pointer; }
  .stadium .hit { fill: transparent; pointer-events: all; }
  .stadium .dog {
    pointer-events: none;
    text-anchor: middle;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .15s;
  }
  .stadium:hover .dog { transform: scale(1.15); }

  #tooltip {
    position: fixed; pointer-events: none; opacity: 0; background: rgba(20,20,20,.92); color: #fff;
    padding: 8px 10px; border-radius: 6px; font-size: 14px; line-height: 1.4; transition: opacity .1s; z-index: 10; font-family: "Roboto Flex"; font-weight: 200
  }
  #tooltip b { display: block; font-size: 15px; font-family: "Roboto Serif"; font-weight: 700; }
  .legend .label { font-size: 11px; fill: #444; font-family: "Roboto Flex"; }
  .legend .dog { text-anchor: middle; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  #error { color: #b00020; display: none; padding: 12px; }

  /* Mobile */
  @media (max-width: 640px) {
    #wrap { padding: 12px; }
    h1 { font-size: 1.5rem; }
    p.sub { font-size: 0.8rem; }
    #tooltip { font-size: 13px; }
    #tooltip b { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>MLB Stadiums by Hot Dog Price</h1>
  <p class="sub" id="sub"></p>
  <div id="error"></div>
  <svg id="map"></svg>
</div>
<div id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const PRICE = "Hot Dog Price (USD)";
const TEAM = "Team";
const EMOJI = "🌭";

// ---- Layout configs --------------------------------------------------
// width/height are viewBox units. `size` is the emoji font-size range (min price -> max price).
const MOBILE_QUERY = window.matchMedia("(max-width: 640px)");
const layouts = {
  desktop: {
    width: 975, height: 610, margin: 10,
    size: [16, 52],
    hitPad: 4,                 // extra invisible hover/tap padding around each emoji
    legend: { x: 20, y: 590, fontSize: 11, titleGap: 13, gap: 6 },
    hint: "Emoji size reflects hot dog price. Hover a stadium for details."
  },
  mobile: {
    width: 600, height: 430, margin: 6,
    size: [14, 34],
    hitPad: 8,
    legend: { x: 12, y: 420, fontSize: 12, titleGap: 12, gap: 4 },
    hint: "Emoji size reflects hot dog price. Tap a stadium for details."
  }
};
const currentLayout = () => MOBILE_QUERY.matches ? layouts.mobile : layouts.desktop;

const svg = d3.select("#map");
const tooltip = d3.select("#tooltip");

// ---- Tooltip ---------------------------------------------------------
function showTip(event, d) {
  tooltip.html(`<b>${d.f.properties[TEAM]}</b>Hot Dog Price (USD): $${d.price.toFixed(2)}`)
         .style("opacity", 1);
  const node = tooltip.node();
  const w = node.offsetWidth, h = node.offsetHeight;
  const touch = event.pointerType === "touch";
  let x = event.clientX + 14;
  let y = touch ? event.clientY - h - 24 : event.clientY + 14; // above the finger on touch
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));    // keep inside the viewport
  if (y < 8) y = event.clientY + 24;
  tooltip.style("left", x + "px").style("top", y + "px");
}
const hideTip = () => tooltip.style("opacity", 0);

// Tapping anywhere that isn't a stadium dismisses the tooltip (touch has no "mouse leave")
document.addEventListener("click", hideTip);

// ---- Drawing ---------------------------------------------------------
function draw(states, mlb) {
  const cfg = currentLayout();
  const { width, height } = cfg;

  svg.attr("viewBox", `0 0 ${width} ${height}`);
  svg.selectAll("*").remove();
  hideTip();
  d3.select("#sub").text(cfg.hint);

  // Plain Albers (no AK/HI insets) so Canadian stadiums like Toronto can be projected.
  const focus = { type: "MultiPoint", coordinates: [
    [-125, 24.5], [-66.5, 24.5], [-125, 49.5], [-66.5, 47.5], [-79.4, 43.7]
  ]};
  const m = cfg.margin;
  const projection = d3.geoAlbers().fitExtent([[m, m], [width - m, height - m]], focus);
  const path = d3.geoPath(projection);

  svg.append("g")
    .selectAll("path")
    .data(states.features)
    .join("path")
    .attr("class", d => d.properties.iso_a2 === "CA" ? "state canada" : "state")
    .attr("d", path);

  const stadiums = mlb.features
    .map(f => ({ f, price: +f.properties[PRICE], xy: projection(d3.geoCentroid(f)) }))
    .filter(d => Number.isFinite(d.price) && d.xy);

  const [minP, maxP] = d3.extent(stadiums, d => d.price);

  // Emoji font-size scale (sqrt so visual area tracks price, starting at the min price)
  const size = d3.scaleSqrt().domain([minP, maxP]).range(cfg.size);

  // Draw big emojis first so small ones stay hoverable on top
  stadiums.sort((a, b) => b.price - a.price);

  const stops = svg.append("g")
    .selectAll("g")
    .data(stadiums)
    .join("g")
    .attr("class", "stadium")
    .attr("transform", d => `translate(${d.xy[0]}, ${d.xy[1]})`)
    // Mouse: hover. Touch is handled by click, because touch pointers
    // "leave" the instant the finger lifts.
    .on("pointerenter pointermove", (event, d) => { if (event.pointerType !== "touch") showTip(event, d); })
    .on("pointerleave", event => { if (event.pointerType !== "touch") hideTip(); })
    .on("click", (event, d) => { event.stopPropagation(); showTip(event, d); });

  stops.append("circle")
    .attr("class", "hit")
    .attr("r", d => size(d.price) * 0.55 + cfg.hitPad);

  stops.append("text")
    .attr("class", "dog")
    .attr("dy", "0.35em")                      // vertically centers the emoji on the stadium
    .style("font-size", d => size(d.price) + "px")
    .text(EMOJI);

  // Legend: stacked emojis (min on top, max at the bottom) with price labels
  const L = cfg.legend;
  const legendValues = [maxP, (minP + maxP) / 2, minP]; // built bottom-up
  const colX = size(maxP) / 2;
  const legend = svg.append("g")
    .attr("class", "legend")
    .attr("transform", `translate(${L.x}, ${L.y})`);

  let cursor = 0;
  legendValues.forEach(v => {
    const s = size(v);
    const cy = cursor - s / 2;
    legend.append("text")
      .attr("class", "dog")
      .attr("x", colX).attr("y", cy).attr("dy", "0.35em")
      .style("font-size", s + "px")
      .text(EMOJI);
    legend.append("text")
      .attr("class", "label")
      .attr("x", size(maxP) + 8).attr("y", cy + L.fontSize / 3)
      .style("font-size", L.fontSize + "px")
      .text(`$${v.toFixed(2)}`);
    cursor -= s + L.gap;
  });

  legend.append("text")
    .attr("class", "label")
    .attr("x", 0)
    .attr("y", cursor + L.gap - L.titleGap + 6)
    .style("font-size", L.fontSize + "px")
    .style("font-weight", 600)
    .text("Hot dog price (USD)");
}

// ---- Load once, redraw when crossing the breakpoint -------------------
Promise.all([d3.json("states.geojson"), d3.json("mlb.geojson")]).then(([states, mlb]) => {
  draw(states, mlb);
  MOBILE_QUERY.addEventListener("change", () => draw(states, mlb));
}).catch(err => {
  const el = document.getElementById("error");
  el.style.display = "block";
  el.textContent = "Couldn't load the GeoJSON files. Make sure states.geojson and mlb.geojson sit next to this HTML file and that you're serving it over http (e.g. `python -m http.server`). Details: " + err.message;
});
</script>
</body>
</html>
